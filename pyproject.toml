[project]
name = "invoice-generator"
version = "0.1.0"
description = "A desktop invoice calculator and PDF generator"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["PySide6>=6.8,<7", "reportlab>=4,<6"]

[project.scripts]
invoice-generator = "invoice_generator:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
